<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Side Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Iniciar Sesión</h1>
      <p class="subtitle">Qué bueno verte de nuevo.</p>

      <div id="message" class="message" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Tu contraseña" />
        </div>

        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>

      <a href="index.html" class="link-back">← Volver al inicio</a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
