<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Side Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Crear cuenta</h1>
      <p class="subtitle">Completa tus datos para registrarte.</p>

      <div id="message" class="message" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="given-name" placeholder="Kevin" />
        </div>

        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" id="apellido" name="apellido" autocomplete="family-name" placeholder="Tus apellidos" />
        </div>

        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
        </div>

        <button type="submit" class="btn btn-primary">Registrarme</button>
      </form>

      <a href="index.html" class="link-back">← Volver al inicio</a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
